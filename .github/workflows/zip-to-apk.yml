name: Zip to APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: zip-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: En guncel zip'i bul ve ac
        run: |
          set -euo pipefail
          ZIP=$(git -c core.quotepath=false log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -m1 '\.zip$' || true)
          rm -rf work && mkdir work
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            echo "Kullanilan zip: $ZIP"
            unzip -q "$ZIP" -d work
          else
            echo "Zip yok, repo kokundeki proje kullaniliyor"
            rsync -a --exclude work --exclude .git ./ work/
          fi
          S=$(find work -name 'settings.gradle*' | head -1)
          [ -n "$S" ] || { echo "Gradle projesi bulunamadi"; exit 1; }
          echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK derle
        run: |
          cd "$PROJ"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon
          else gradle assembleDebug --no-daemon; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$(find . -name '*-debug.apk' | head -1)" "$GITHUB_WORKSPACE/out/kumanda.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kumanda-apk
          path: out/kumanda.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: out/kumanda.apk
