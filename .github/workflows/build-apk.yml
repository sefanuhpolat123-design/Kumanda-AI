name: Build APK from latest ZIP

on:
  push:
    paths:
      - 'source-zips/**'
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: En son yüklenen ZIP'i bul
        id: zip
        run: |
          set -e
          BEST=""; BEST_T=0
          shopt -s nullglob
          for f in source-zips/*.zip; do
            T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            T=${T:-0}
            if [ "$T" -ge "$BEST_T" ]; then BEST="$f"; BEST_T="$T"; fi
          done
          if [ -z "$BEST" ]; then
            echo "::error::source-zips/ klasöründe .zip dosyası yok"; exit 1
          fi
          echo "Derlenecek ZIP: $BEST"
          echo "zip=$BEST" >> "$GITHUB_OUTPUT"

      - name: ZIP'i aç ve Android projesini bul
        id: proj
        run: |
          set -e
          rm -rf /tmp/src && mkdir -p /tmp/src
          unzip -q "${{ steps.zip.outputs.zip }}" -d /tmp/src
          S=$(find /tmp/src \( -name settings.gradle.kts -o -name settings.gradle \) | awk '{print length, $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$S" ]; then echo "::error::ZIP içinde settings.gradle(.kts) bulunamadı"; exit 1; fi
          DIR=$(dirname "$S")
          echo "Proje dizini: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Vosk Türkçe modeli indir (proje içinde yoksa)
        run: |
          set -e
          D="${{ steps.proj.outputs.dir }}/app/src/main/assets"
          if [ -d "$D/model" ]; then echo "Model zaten var"; exit 0; fi
          mkdir -p "$D" /tmp/vm
          curl -fL -o /tmp/vm/m.zip https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip \
            || curl -fL -o /tmp/vm/m.zip https://huggingface.co/rhasspy/vosk-models/resolve/main/tr/vosk-model-small-tr-0.3.zip
          unzip -q /tmp/vm/m.zip -d /tmp/vm
          mv /tmp/vm/vosk-model-small-tr-0.3 "$D/model"
          uuidgen > "$D/model/uuid"

      - name: Debug APK derle
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: APK adını ayarla
        run: |
          set -e
          mkdir -p out
          APK=$(find "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug" -name '*.apk' | head -n1)
          cp "$APK" out/KumandaPlus-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KumandaPlus-debug
          path: out/KumandaPlus-debug.apk
