name: Kumanda+ Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: En güncel kaynak ZIP'ini aç (varsa)
        shell: bash
        run: |
          if [ -f source-zips/latest.zip ]; then
            mkdir -p /tmp/kumanda-source
            unzip -q source-zips/latest.zip -d /tmp/kumanda-source
            PROJECT_DIR="$(dirname "$(find /tmp/kumanda-source -name settings.gradle.kts -print -quit)")"
            if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
              echo "latest.zip içinde geçerli Android proje yapısı bulunamadı." >&2
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle kur ve önbellekle
        uses: gradle/actions/setup-gradle@v4
      - name: En güncel projeden APK oluştur
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug
      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: KumandaPlus-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
